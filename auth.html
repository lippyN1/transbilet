<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5f7fb"><meta name="description" content="Вход и регистрация в WayGo"><title>Вход — WayGo</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/style.css"><script src="/static/app.js" defer></script></head>
<body class="auth-only"><main id="main" class="auth-only-main"><a class="brand auth-brand" href="/" aria-label="WayGo — главная"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" focusable="false"><path d="M4 17.5 27 5l-7.4 22-4.2-7.6L4 17.5Z" fill="currentColor"/><path d="m15.4 19.4 5.8-7.1-8 5.2" fill="none" stroke="var(--logo-cutout,#fff)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>way<span class="brand-accent">go</span></span></a><section class="auth-card content-card auth-only-card"><div class="auth-tabs" role="tablist" aria-label="Выбор действия"><button type="button" class="auth-tab is-active" data-mode="login" role="tab" aria-selected="true">Вход</button><button type="button" class="auth-tab" data-mode="register" role="tab" aria-selected="false">Регистрация</button></div><div id="login-panel"><div class="eyebrow">С ВОЗВРАЩЕНИЕМ</div><h1 class="auth-form-title">Войти в WayGo</h1><p class="muted">Войди, чтобы управлять поездками и бронированиями.</p><form id="login-form" class="stack-form"><label for="login-email">Электронная почта</label><input id="login-email" class="text-input" type="email" required placeholder="name@example.com" autocomplete="email"><label for="login-password">Пароль</label><input id="login-password" class="text-input" type="password" required minlength="8" placeholder="Пароль" autocomplete="current-password"><button class="button button-primary button-wide" type="submit">Войти в аккаунт <span>→</span></button><p class="form-message" id="login-status" aria-live="polite"></p></form></div><div id="register-panel" hidden><div class="eyebrow">НАЧНИ СВОЮ ИСТОРИЮ</div><h1 class="auth-form-title">Создать аккаунт</h1><p class="muted">Несколько данных — и можно планировать поездки.</p><form id="register-form" class="stack-form"><label for="register-name">Имя</label><input id="register-name" class="text-input" required minlength="2" placeholder="Как тебя зовут?" autocomplete="name"><label for="register-email">Электронная почта</label><input id="register-email" class="text-input" type="email" required placeholder="name@example.com" autocomplete="email"><label for="register-password">Пароль</label><input id="register-password" class="text-input" type="password" required minlength="8" placeholder="Минимум 8 символов" autocomplete="new-password"><button class="button button-primary button-wide" type="submit">Создать аккаунт <span>→</span></button><p class="form-message" id="register-status" aria-live="polite"></p></form></div><p class="auth-legal">Учебный сервис WayGo. Не используй пароль от других сайтов.</p></section><a class="auth-back-link" href="/">← Вернуться на главную</a></main></body></html>
