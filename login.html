<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход и регистрация — ТрансБилет</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="logo">
      <img src="img/logo.svg" alt="Логотип ТрансБилет" width="40" height="40">
      <span>ТрансБилет</span>
    </a>
    <nav class="main-nav" aria-label="Основная навигация">
      <ul>
        <li><a href="index.html">Главная</a></li>
        <li><a href="catalog.html">Рейсы</a></li>
        <li><a href="item.html">Рейс</a></li>
        <li><a href="action.html">Мои билеты</a></li>
        <li><a href="contacts.html">Контакты</a></li>
        <li data-auth-slot></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Вход и регистрация</h1>
    <p class="note">Клиентская авторизация через localStorage.</p>

    <div class="auth-grid">
      <section class="auth-card">
        <h2>Войти</h2>
        <form id="login-form" action="#" novalidate>
          <label for="login-email">Email</label>
          <input type="email" id="login-email" name="email" required>
          <label for="login-password">Пароль</label>
          <input type="password" id="login-password" name="password" minlength="6" required>
          <button type="submit" class="btn">Войти</button>
          <p class="form-status" id="login-status" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="auth-card">
        <h2>Зарегистрироваться</h2>
        <form id="register-form" action="#" novalidate>
          <label for="reg-name">Имя</label>
          <input type="text" id="reg-name" name="name" required>
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" name="email" required>
          <label for="reg-password">Пароль (минимум 6 символов)</label>
          <input type="password" id="reg-password" name="password" minlength="6" required>
          <button type="submit" class="btn">Создать аккаунт</button>
          <p class="form-status" id="register-status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <p>© 2026 ТрансБилет. Учебный проект.</p>
    <p><a href="contacts.html">Контакты</a></p>
  </footer>

  <script src="ui.js"></script>
  <script src="auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(location.search);
      const next   = params.get("next") || "action.html";

      const loginForm = document.getElementById("login-form");
      const loginMsg  = document.getElementById("login-status");
      loginForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const email    = loginForm.email.value.trim();
        const password = loginForm.password.value;
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          loginMsg.textContent = "Некорректный email.";
          loginMsg.className = "form-status form-status--error";
          return;
        }
        if (password.length < 6) {
          loginMsg.textContent = "Пароль короче 6 символов.";
          loginMsg.className = "form-status form-status--error";
          return;
        }
        const res = login({ email: email, password: password });
        loginMsg.textContent = res.message;
        loginMsg.className = "form-status " + (res.ok ? "form-status--ok" : "form-status--error");
        if (res.ok) { showToast(res.message); setTimeout(() => location.href = next, 700); }
      });

      const regForm = document.getElementById("register-form");
      const regMsg  = document.getElementById("register-status");
      regForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const name     = regForm.name.value.trim();
        const email    = regForm.email.value.trim();
        const password = regForm.password.value;
        if (name.length < 2) { regMsg.textContent = "Укажите имя."; regMsg.className = "form-status form-status--error"; return; }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { regMsg.textContent = "Некорректный email."; regMsg.className = "form-status form-status--error"; return; }
        if (password.length < 6) { regMsg.textContent = "Пароль короче 6 символов."; regMsg.className = "form-status form-status--error"; return; }
        const res = register({ name: name, email: email, password: password });
        regMsg.textContent = res.message;
        regMsg.className = "form-status " + (res.ok ? "form-status--ok" : "form-status--error");
        if (res.ok) { showToast(res.message); setTimeout(() => location.href = next, 700); }
      });
    });
  </script>
</body>
</html>
